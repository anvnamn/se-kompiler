name: The Pipe

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
      with:
        submodules: 'recursive'

    - name: Build
      run: bash build.sh build

    - name: Test
      working-directory: ${{github.workspace}}/build
      run: ctest

    - name: Upload binary
      uses: actions/upload-artifact@v4
      with:
        name: sek
        path: build/src/sek
