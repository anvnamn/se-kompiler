name: The Pipe

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  lint:
    runs-on: self-hosted

    steps:
    - name: Checkout repo
      uses: actions/checkout@v4
      with:
        submodules: 'recursive'
      
    - name: Generate compile commands
      run: bash build.sh config

    - name: Run clang-format
      run: find src include tests -name "*.cpp" -o -name "*.h" | xargs clang-format-14 --dry-run --Werror

    - name: Run clang-tidy
      run: find src include tests -name '*.cpp' -o -name '*.h' | xargs clang-tidy-14 -p build

  build-test:
    runs-on: self-hosted

    steps:
    - name: Checkout repo
      uses: actions/checkout@v4
      with:
        submodules: 'recursive'

    - name: Build
      run: bash build.sh build

    - name: Test
      working-directory: ${{github.workspace}}/build
      run: ctest
